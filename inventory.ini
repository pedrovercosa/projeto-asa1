[servidores]
arq ansible_host=127.0.0.1 ansible_port=2222
db  ansible_host=127.0.0.1 ansible_port=2200
app ansible_host=127.0.0.1 ansible_port=2201
cli ansible_host=127.0.0.1 ansible_port=2202

[servidores:vars]
ansible_user=vagrant
# O segredo: usamos o comando 'vagrant ssh-config' para descobrir o caminho exato da chave em tempo real
ansible_ssh_private_key_file="{{ lookup('pipe', 'vagrant ssh-config ' + inventory_hostname + ' | grep IdentityFile | awk \"{print \\$2}\"') }}"
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
ansible_python_interpreter=/usr/bin/python3
