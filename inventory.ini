[servidores]
arq ansible_host=127.0.0.1 ansible_port=2222
db  ansible_host=127.0.0.1 ansible_port=2200
app ansible_host=127.0.0.1 ansible_port=2201
cli ansible_host=127.0.0.1 ansible_port=2202

[servidores:vars]
ansible_user=vagrant
# Aponta diretamente para a chave RSA global do seu ambiente Vagrant local
ansible_ssh_private_key_file=/home/ifpb/.vagrant.d/insecure_private_keys/vagrant.key.rsa
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
ansible_python_interpreter=/usr/bin/python3
