---
- name: Configurar LVM no Servidor de Arquivos
  hosts: arq
  become: yes
  tasks:
    - name: Instalar ferramentas de LVM
      apt:
        name: lvm2
        state: present

    - name: Criar Volume Group (VG) chamado vg_dados
      lvg:
        vg: vg_dados
        pvs: /dev/sdb,/dev/sdc,/dev/sdd
        pvresize: yes

    - name: Criar Logical Volume (LV) de 15GB
      # se tiver menos que isso, ele usa o máximo disponível.
      lvol:
        vg: vg_dados
        lv: lv_arquivos
        size: 15G
        force: yes

    - name: Formatar o volume com sistema de arquivos EXT4
      filesystem:
        fstype: ext4
        dev: /dev/vg_dados/lv_arquivos

    - name: Criar diretório de montagem /dados
      file:
        path: /dados
        state: directory
        mode: '0755'

    - name: Montar o volume de forma persistente
      mount:
        path: /dados
        src: /dev/vg_dados/lv_arquivos
        fstype: ext4
        state: mounted
