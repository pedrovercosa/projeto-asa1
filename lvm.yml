---
- name: Configurar LVM no Servidor de Arquivos
  hosts: arq
  become: yes
  tasks:
    - name: Instalar ferramentas de LVM
      apt:
        name: lvm2
        state: present

    - name: Criar Volume Group (VG) chamado dados
      lvg:
        vg: dados
        pvs: /dev/sdb,/dev/sdc,/dev/sdd

    - name: Criar Logical Volume (LV) chamado ifpb com 15GB
      lvol:
        vg: dados
        lv: ifpb
        size: 15G

    - name: Formatar o volume com sistema de arquivos EXT4
      filesystem:
        fstype: ext4
        dev: /dev/dados/ifpb

    - name: Garantir que o diretório /dados existe
      file:
        path: /dados
        state: directory
        mode: '0755'

    - name: Montar o volume de forma persistente
      mount:
        path: /dados
        src: /dev/dados/ifpb
        fstype: ext4
        state: mounted
